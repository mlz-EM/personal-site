# Simple workflow for deploying static content to GitHub Pages
name: Deploy static content to Pages

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["main"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      artifact_id: ${{ steps.upload.outputs.artifact_id }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v3
        with:
          node-version-file: ".nvmrc"
          cache: "npm"
      - name: Install
        run: npm ci
      - name: Validate content
        run: npm run validate:content
      - name: Build and Render
        shell: bash
        run: |
          # NOTE: Rendering can be flaky and react-snap is no
          # longer maintained, so retry until I convert to next.
          function retry {
            local n=1
            local max=5
            local delay=1
            while true; do
              "$@" && break || {
                if [[ $n -lt $max ]]; then
                  ((n++))
                  echo "Command failed. Attempt $n/$max:"
                  sleep $delay;
                else
                  echo "The command has failed after $n attempts."
                  return 1
                fi
              }
            done
          }
          retry npm run predeploy
        env:
          NODE_ENV: production
          REACT_APP_VISITOR_MAP_API_URL: ${{ vars.VISITOR_MAP_API_URL }}
      - name: Upload artifact
        id: upload
        uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: "build"

  deploy:
    needs: build
    permissions:
      actions: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment_retry.outputs.page_url || steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - name: Wait for uploaded Pages artifact
        env:
          GH_TOKEN: ${{ github.token }}
          PAGES_ARTIFACT_ID: ${{ needs.build.outputs.artifact_id }}
        shell: bash
        run: |
          if [[ ! "$PAGES_ARTIFACT_ID" =~ ^[0-9]+$ ]]; then
            echo "::error::The build did not return a valid Pages artifact ID."
            exit 1
          fi
          for attempt in {1..6}; do
            if artifact=$(timeout 8s gh api --method GET --jq 'select(.name == "github-pages" and .expired == false) | .id' \
              "repos/$GITHUB_REPOSITORY/actions/artifacts/$PAGES_ARTIFACT_ID") &&
              [[ "$artifact" == "$PAGES_ARTIFACT_ID" ]]; then
              echo "Pages artifact $artifact is available."
              exit 0
            fi
            if [[ "$attempt" -lt 6 ]]; then
              sleep 10
            fi
          done
          echo "::error::Pages artifact $PAGES_ARTIFACT_ID was not visible after six checks."
          exit 1
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5.0.1
        continue-on-error: true
      - name: Wait before retrying Pages deployment
        id: retry_wait
        if: steps.deployment.outcome == 'failure'
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        shell: bash
        run: |
          # deploy-pages sets page_url after deployment creation, before polling.
          if [[ -n "$PAGE_URL" ]]; then
            echo "::error::Pages created the deployment, but it did not report success."
            exit 1
          fi
          echo "::warning::Pages deployment failed before returning a URL. Retrying in 60 seconds."
          sleep 60
      - name: Retry GitHub Pages deployment
        id: deployment_retry
        if: steps.retry_wait.outcome == 'success'
        uses: actions/deploy-pages@v5.0.1
